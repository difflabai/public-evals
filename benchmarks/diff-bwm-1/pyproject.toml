[build-system]
requires = ["setuptools>=77"]  # 77+: PEP 639 license expression + license-files
build-backend = "setuptools.build_meta"

[project]
name = "diff-bwm-1"
version = "1.0.0"
description = "diff-bwm-1: a six-eval benchmark for LLM planning agents that can (or cannot) run a numerical model of their domain"
readme = "README.md"
requires-python = ">=3.10"
# MIT for the code (LICENSE), CC-BY-4.0 for authored data and prompts (LICENSE-DATA),
# Apache-2.0 for material derived from AA-Briefcase-Lite (NOTICE).
license = "MIT AND CC-BY-4.0 AND Apache-2.0"
license-files = ["LICENSE", "LICENSE-DATA", "NOTICE", "LICENSES/Apache-2.0.txt"]
authors = [{ name = "Differential AI Lab" }]
dependencies = []

[project.optional-dependencies]
eval4 = ["openpyxl==3.1.5"]
recalc = ["formulas==1.3.4", "schedula==1.6.15"]
eval5 = ["pyyaml==6.0.3"]
eval6 = ["numpy>=2.0,<3"]
# scipy is optional: dbwm.core.stats.kendall_tau_b (stdlib) is bit-identical to scipy 1.13.1 and 1.18.1;
# this extra only lets the tests and selftests cross-check against scipy.
eval6-exact = ["numpy>=2.0,<3", "scipy>=1.13.1,<2"]
all = ["openpyxl==3.1.5", "formulas==1.3.4", "schedula==1.6.15", "pyyaml==6.0.3", "numpy>=2.0,<3"]
dev = ["pytest>=8"]

[project.scripts]
dbwm = "dbwm.cli:main"

[tool.setuptools.packages.find]
include = ["dbwm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: takes more than a few seconds (container end-to-end runs); deselect with -m 'not slow'",
    "docker: needs a Docker daemon and the dbwm-agent image (also skips by itself without them)",
    "live: makes real model calls; opt-in via an environment variable (also skips by itself)",
]
